version: '3.8'

services:
  talentpulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentpulse-unified-platform
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/talentpulse.db
      - SECRET_KEY=talentpulse-secret-change-in-production-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - talentpulse_data:/app/backend/data
    restart: unless-stopped

volumes:
  talentpulse_data:
