<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — TalentPulse AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .forgot-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .forgot-card { width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px; padding: 36px 32px; backdrop-filter: blur(20px); text-align: center; }
    .status-box { padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 0.85rem; word-break: break-all; }
  </style>
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="forgot-wrapper">
    <div class="forgot-card">
      <span class="logo-mark">TP</span>
      <h2 style="margin-top: 12px; margin-bottom: 6px;">Reset Password</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">Enter your registered username or email to generate a one-time recovery link.</p>

      <form id="forgot-form">
        <div class="form-group" style="text-align: left;">
          <label>Username or Work Email</label>
          <input type="text" id="identifier" placeholder="e.g. employee_john" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Generate Recovery Link</button>
      </form>

      <div id="result-box" class="status-box" style="display: none;"></div>

      <div style="margin-top: 20px;">
        <a href="login.html" style="font-size: 0.85rem; color: var(--text-muted);">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const box = document.getElementById('result-box');
      btn.disabled = true;

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('identifier').value })
        });
        const data = await res.json();

        box.style.display = 'block';
        if (data.reset_url) {
          box.style.background = 'rgba(16, 185, 129, 0.15)';
          box.style.color = '#34d399';
          box.innerHTML = `<strong>Recovery Link Generated:</strong><br/><a href="${data.reset_url}" style="color:#c084fc;">Click here to reset your password</a>`;
        } else {
          box.style.background = 'rgba(59, 130, 246, 0.15)';
          box.style.color = '#93c5fd';
          box.textContent = data.message;
        }
      } catch (err) {
        box.style.display = 'block';
        box.style.background = 'rgba(244, 63, 94, 0.15)';
        box.style.color = '#fb7185';
        box.textContent = 'Error processing reset request.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
