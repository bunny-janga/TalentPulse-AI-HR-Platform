<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — TalentPulse AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .reset-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .reset-card { width: 100%; max-width: 420px; background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px; padding: 36px 32px; backdrop-filter: blur(20px); text-align: center; }
  </style>
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="reset-wrapper">
    <div class="reset-card">
      <span class="logo-mark">TP</span>
      <h2 style="margin-top: 12px; margin-bottom: 6px;">Create New Password</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px;">Enter your replacement credentials below.</p>

      <div id="status-msg" style="display:none; padding:12px; border-radius:8px; margin-bottom:16px; font-size:0.85rem;"></div>

      <form id="reset-form">
        <div class="form-group" style="text-align: left;">
          <label>New Password (min 6 characters)</label>
          <input type="password" id="new-pw" minlength="6" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Save New Password</button>
      </form>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('status-msg');

    if (!token) {
      msg.style.display = 'block';
      msg.style.background = 'rgba(244, 63, 94, 0.15)';
      msg.style.color = '#fb7185';
      msg.textContent = 'Missing recovery token.';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: document.getElementById('new-pw').value })
        });
        const data = await res.json();

        msg.style.display = 'block';
        if (data.success) {
          msg.style.background = 'rgba(16, 185, 129, 0.15)';
          msg.style.color = '#34d399';
          msg.textContent = data.message;
          form.style.display = 'none';
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
          msg.style.background = 'rgba(244, 63, 94, 0.15)';
          msg.style.color = '#fb7185';
          msg.textContent = data.error;
          btn.disabled = false;
        }
      } catch (err) {
        msg.style.display = 'block';
        msg.style.background = 'rgba(244, 63, 94, 0.15)';
        msg.style.color = '#fb7185';
        msg.textContent = 'Server communication error.';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
