<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Registration — TalentPulse AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .register-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .register-card { width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 20px; padding: 36px 32px; backdrop-filter: blur(20px); }
    .status-box { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.88rem; display: none; }
  </style>
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="register-wrapper">
    <div class="register-card">
      <div style="text-align: center; margin-bottom: 20px;">
        <span class="logo-mark">TP</span>
        <h2 style="margin-top: 10px;">Activate Account</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted);" id="invite-desc">Verifying registration token...</p>
      </div>

      <div id="status-msg" class="status-box"></div>

      <form id="register-form" style="display: none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" placeholder="Jane Doe" required />
        </div>
        <div class="form-group">
          <label>Assigned Department</label>
          <input type="text" id="reg-dept" disabled style="opacity: 0.7;" />
        </div>
        <div class="form-group">
          <label>Choose Username</label>
          <input type="text" id="reg-username" placeholder="janedoe" required />
        </div>
        <div class="form-group">
          <label>Choose Password (min 6 chars)</label>
          <input type="password" id="reg-password" minlength="6" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">
          <span>Complete Registration</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 16px;">
        <a href="/login.html" style="color: var(--text-muted); font-size: 0.85rem;">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const statusMsg = document.getElementById('status-msg');
    const form = document.getElementById('register-form');
    const desc = document.getElementById('invite-desc');

    if (!token) {
      desc.textContent = "No invite token detected. Please request an invite link from HR.";
    } else {
      fetch(`/api/verify-invite?token=${token}`)
        .then(res => res.json())
        .then(data => {
          if (data.valid) {
            desc.textContent = `Invited as ${data.role.toUpperCase()} in ${data.department}`;
            document.getElementById('reg-dept').value = data.department;
            form.style.display = 'block';
          } else {
            desc.textContent = data.error || "Invalid invite link.";
          }
        })
        .catch(() => { desc.textContent = "Error connecting to server."; });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      btn.disabled = true;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            full_name: document.getElementById('reg-name').value,
            username: document.getElementById('reg-username').value,
            password: document.getElementById('reg-password').value
          })
        });
        const result = await res.json();

        if (result.success) {
          statusMsg.style.display = 'block';
          statusMsg.style.background = 'rgba(16, 185, 129, 0.15)';
          statusMsg.style.color = '#34d399';
          statusMsg.textContent = result.message;
          form.style.display = 'none';
          setTimeout(() => { window.location.href = '/login.html'; }, 2000);
        } else {
          statusMsg.style.display = 'block';
          statusMsg.style.background = 'rgba(244, 63, 94, 0.15)';
          statusMsg.style.color = '#fb7185';
          statusMsg.textContent = result.error;
          btn.disabled = false;
        }
      } catch (err) {
        alert('Registration request failed.');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
